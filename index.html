<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Markus Krueger – Visitenkarte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --olive: #a8a46c;
      --blau: #bcd8e6;
      --creme: #fff4dc;
      --rot: #c8301f;
      --dunkel: #2b1b12;
      --radius: 28px;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 1.05rem;
      color: var(--dunkel);
      background:
        repeating-linear-gradient(90deg, var(--olive) 0 44px, var(--blau) 44px 56px);
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
    }

    .karte {
      width: min(880px, 100%);
      background: var(--creme);
      border-radius: var(--radius);
      padding: clamp(1.5rem, 5vw, 3.5rem);
      box-shadow: 0 30px 60px -20px rgba(43, 27, 18, .45);
      position: relative;
      overflow: hidden;
    }

    /* kleine rote Zierkante als Anspielung auf das Original */
    .karte::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 10px;
      background: repeating-linear-gradient(90deg, var(--rot) 0 10px, transparent 10px 20px);
    }

    /* Name – groß, oben */
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: clamp(3rem, 11vw, 6.5rem);
      line-height: .95;
      letter-spacing: -.04em;
      margin-top: .75rem;
    }

    .untertitel {
      font-size: 1.25rem;
      margin: .75rem 0 2.5rem;
      color: var(--rot);
      font-weight: 500;
    }

    .inhalt {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: clamp(1.5rem, 4vw, 3rem);
      align-items: start;
    }

    .foto {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 22px;
      background: var(--blau);
      display: block;
    }

    .liste { display: grid; gap: .75rem; list-style: none; padding: 0; }

    .eintrag {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .9rem 1.1rem;
      background: #fff;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.eintrag:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px rgba(43, 27, 18, .35);
    }

    .icon {
      flex: none;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--blau);
    }
    .icon svg { width: 22px; height: 22px; stroke: var(--dunkel); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .eintrag small { display: block; font-size: .8rem; opacity: .6; }
    .eintrag span { font-weight: 500; overflow-wrap: anywhere; }

    .knoepfe { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }

    .knopf {
      font: inherit;
      font-weight: 500;
      padding: .85rem 1.5rem;
      border-radius: 999px;
      border: 2px solid var(--dunkel);
      background: transparent;
      color: var(--dunkel);
      text-decoration: none;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .knopf.voll { background: var(--dunkel); color: var(--creme); }
    .knopf:hover { background: var(--rot); border-color: var(--rot); color: #fff; }
    .knopf:focus-visible, .eintrag:focus-visible { outline: 3px solid var(--rot); outline-offset: 3px; }

    @media (max-width: 680px) {
      .inhalt { grid-template-columns: 1fr; }
      .foto { aspect-ratio: 1; max-width: 280px; }
    }
  </style>
</head>
<body>
  <main class="karte">

    
    <h1>Markus<br>Krüger</h1>
    <p class="untertitel">Technische Leitung</p>

    <div class="inhalt">

      
      <img class="foto" src="foto.jpg" alt="Foto von Dein Name">

      <div>
        
        <ul class="liste">
          <li>
            <a class="eintrag" href="tel:+43676844202240">
              <div class="icon"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
              <div><small>Telefon</small><span>+43 676 844202240</span></div>
            </a>
          </li>
          <li>
            <a class="eintrag" href="mailto:markus.krueger@vtm-group.com">
              <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 8 9 6 9-6"/></svg></div>
              <div><small>E-Mail</small><span>markus.krueger@vtm-group.com</span></div>
            </a>
          </li>
       
          
        </ul>

        <div class="knoepfe">
          <button class="knopf voll" id="speichern" type="button">Kontakt speichern</button>
          <a class="knopf" href="mailto:markus.krueger@vtm-group.com">E-Mail schreiben</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    
    const kontakt = {
      name: "Markus Krüger",
      telefon: "+43 676 844202240",
      email: "markus.krueger@vtm-group.com"
    };

    document.getElementById("speichern").addEventListener("click", () => {
      const vcf = [
        "BEGIN:VCARD", "VERSION:3.0",
        `FN:${kontakt.name}`,
        `TEL;TYPE=CELL:${kontakt.telefon}`,
        `EMAIL:${kontakt.email}`,
        "END:VCARD"
      ].join("\r\n");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard" }));
      link.download = "kontakt.vcf";
      link.click();
      URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
